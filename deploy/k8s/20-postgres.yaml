# PostgreSQL HA via CloudNativePG operator (install: https://cloudnative-pg.io): 3 instances across zones,
# one synchronous standby (RPO 0), automatic failover typically < 30 s; apps use the -rw service, which always points at the primary.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: amer-pg, namespace: amer-teams}
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  primaryUpdateStrategy: unsupervised
  minSyncReplicas: 1
  maxSyncReplicas: 2
  postgresql:
    parameters: {max_connections: "300", shared_buffers: "1GB", synchronous_commit: "on"}
  bootstrap:
    initdb:
      database: synapse
      owner: synapse
      localeCollate: C
      localeCType: C
      encoding: UTF8
      postInitSQL: ["CREATE DATABASE amer OWNER synapse ENCODING 'UTF8'"]
  storage: {size: 100Gi}
  affinity:
    enablePodAntiAffinity: true
    topologyKey: topology.kubernetes.io/zone
  monitoring: {enablePodMonitor: true}
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://amer-teams-backups/pg
      s3Credentials:
        accessKeyId: {name: backup-s3, key: ACCESS_KEY_ID}
        secretAccessKey: {name: backup-s3, key: SECRET_ACCESS_KEY}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata: {name: amer-pg-daily, namespace: amer-teams}
spec:
  schedule: "0 0 2 * * *"
  cluster: {name: amer-pg}
