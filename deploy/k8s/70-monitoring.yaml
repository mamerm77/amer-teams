# For kube-prometheus-stack: scrape targets and the same 8 alert rules as deploy/monitoring/alerts.yml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: amer-teams, namespace: amer-teams, labels: {release: kube-prometheus-stack}}
spec:
  selector: {matchExpressions: [{key: app, operator: In, values: [orchestrator, livekit, synapse]}]}
  endpoints:
    - {port: http, path: /metrics, interval: 15s}
    - {port: metrics, path: /_synapse/metrics, interval: 15s}
    - {port: metrics, path: /metrics, interval: 15s}
---
# generated from deploy/monitoring/alerts.yml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: amer-teams
  namespace: amer-teams
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: amer-teams-availability
    rules:
    - alert: ServiceDown
      expr: up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: '{{ $labels.job }} is not answering ({{ $labels.instance }})'
    - alert: ProbeFailing
      expr: amer_service_up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: '{{ $labels.service }} failed its health probe'
    - alert: SlowChatServer
      expr: amer_service_probe_latency_ms{service="chat (Synapse)"} > 500
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Chat server responds in {{ $value | humanize }} ms (target < 500
          ms)
  - name: amer-teams-security
    rules:
    - alert: AuditLogTampered
      expr: amer_audit_chain_intact == 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "Audit log hash chain no longer verifies \u2014 investigate immediately"
    - alert: AIAgentErrors
      expr: sum by (agent) (increase(amer_agent_errors_total[10m])) > 5
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: AI agent {{ $labels.agent }} failed {{ $value | humanize }} times
          in 10 minutes
  - name: amer-teams-data
    rules:
    - alert: PostgresDown
      expr: pg_up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "PostgreSQL is down \u2014 chat and audit data unavailable"
    - alert: PostgresConnectionsHigh
      expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: PostgreSQL connections above 80 % of the limit
    - alert: RedisDown
      expr: redis_up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Redis is down \u2014 media server routing affected"
