# Amer Teams — Phase 1+2 single-host deployment
# Services: Postgres, Redis, Synapse (Matrix, E2EE chat), LiveKit (SFU, E2EE media relay),
#           Orchestrator (AI engine + call token service), Caddy (TLS reverse proxy)
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck: {test: ["CMD-SHELL","pg_isready -U synapse"], interval: 5s, retries: 20}
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  synapse:
    image: matrixdotorg/synapse:v1.120.0
    depends_on: {postgres: {condition: service_healthy}}
    environment: {SYNAPSE_CONFIG_PATH: /data/homeserver.yaml, PYTHONPATH: /modules}
    volumes: [./synapse:/data, ./synapse-modules:/modules:ro]   # partner policy module (docs/PARTNERS.md)
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.8.0
    command: --config /etc/livekit.yaml
    volumes: [./livekit.yaml:/etc/livekit.yaml:ro]
    ports:
      - "7881:7881"            # ICE/TCP fallback
      - "50000-50100:50000-50100/udp"  # media (encrypted frames only)
    depends_on: [redis]
    restart: unless-stopped

  enclave:
    # AI proxy that requests are encrypted to (docs/ENCRYPTED_AI.md); on a confidential VM it reports hardware attestation
    build: ../services/enclave
    environment: {ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}", LLM_MODEL: "${LLM_MODEL:-claude-sonnet-4-5}"}
    restart: unless-stopped

  orchestrator:
    build: ../services/orchestrator
    env_file: .env
    environment:
      ENCLAVE_URL: http://enclave:8090
      SYNAPSE_URL: http://synapse:8008
      LIVEKIT_PUBLIC_URL: wss://${DOMAIN}/livekit
      LIVEKIT_HTTP_URL: http://livekit:7880
      DATABASE_URL: postgresql://synapse:${POSTGRES_PASSWORD}@postgres:5432/amer
      ALERTMANAGER_URL: http://alertmanager:9093
    volumes: [agentops:/data/agentops]     # Agent Ops project workspaces
    depends_on:
      postgres: {condition: service_healthy}
      synapse: {condition: service_started}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"], interval: 10s, retries: 5}
    restart: unless-stopped

  # Amer, the AI assistant, as an encrypted chat participant (docs/AMER_CHAT.md). Created by the setup scripts.
  amer-bot:
    build: ../services/amer-bot
    env_file: .env
    environment:
      HS: http://synapse:8008
      ORCH: http://orchestrator:8080
      SERVER_NAME: ${SERVER_NAME}
    volumes: [amerbot:/data/amer-bot]           # keeps Amer's device and keys across restarts
    depends_on:
      orchestrator: {condition: service_healthy}
    restart: unless-stopped

  # Compliance archiver for business tenants (docs/COMPLIANCE.md). Off by default:
  #   docker compose --profile compliance up -d archiver   (needs ARCHIVER_USER / ARCHIVER_PASSWORD in .env)
  archiver:
    profiles: [compliance]
    build: ../services/archiver
    env_file: .env
    environment:
      HS: http://synapse:8008
      SERVER_NAME: ${SERVER_NAME}
      DATABASE_URL: postgresql://synapse:${POSTGRES_PASSWORD}@postgres:5432/amer
    volumes: [archiver:/data/archiver]          # keeps the archiver's device and keys across restarts
    depends_on:
      orchestrator: {condition: service_healthy}
    restart: unless-stopped

  backup:
    image: postgres:16.4
    depends_on: {postgres: {condition: service_healthy}}
    environment: {PGPASSWORD: "${POSTGRES_PASSWORD}"}
    volumes: [./backups:/backups]
    entrypoint: ["/bin/sh", "-c", "while true; do for db in synapse amer; do pg_dump -h postgres -U synapse -Fc $$db > /backups/$$db-$$(date +%F).dump; done; find /backups -name '*.dump' -mtime +14 -delete; sleep 86400; done"]
    restart: unless-stopped

  # ---------------- phone network (SIP) — optional: docker compose --profile phone up -d ----------------
  livekit-sip:
    image: livekit/sip:v1.0.0
    profiles: [phone]
    network_mode: host                         # SIP signalling 5060/5061 and RTP media ports
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis: {address: 127.0.0.1:6379}
        sip_port: 5060
        tls: {port: 5061, certs: [{cert_file: /certs/sip.crt, key_file: /certs/sip.key}]}
        rtp_port: 10000-20000
        use_external_ip: true
        logging: {level: info}
    volumes: [./sip-certs:/certs:ro]
    restart: unless-stopped

  # ---------------- monitoring ----------------
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d", "--web.enable-lifecycle"]
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro, promdata:/prometheus]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--cluster.listen-address="]   # single node
    volumes: [./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.3.0
    environment: {GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me}", GF_SERVER_ROOT_URL: "https://${DOMAIN}/grafana/", GF_SERVER_SERVE_FROM_SUB_PATH: "true"}
    volumes: [./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro, ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro, grafanadata:/var/lib/grafana]
    restart: unless-stopped
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment: {DATA_SOURCE_NAME: "postgresql://synapse:${POSTGRES_PASSWORD}@postgres:5432/synapse?sslmode=disable"}
    restart: unless-stopped
  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment: {REDIS_ADDR: "redis://redis:6379"}
    restart: unless-stopped

  sygnal:
    image: matrixdotorg/sygnal:v0.15.1
    environment: {SYGNAL_CONF: /sygnal.yaml}
    volumes:
      - ./sygnal.yaml:/sygnal.yaml:ro
      - ./push-secrets:/secrets:ro      # APNs .p8 key and FCM service-account JSON
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    ports: ["80:80","443:443"]
    environment: {DOMAIN: "${DOMAIN}"}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [synapse, livekit, orchestrator, sygnal]
    restart: unless-stopped

volumes: {pgdata: {}, redisdata: {}, caddydata: {}, promdata: {}, grafanadata: {}, archiver: {}, amerbot: {}, agentops: {}}
