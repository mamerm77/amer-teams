# Amer Teams monitoring — what Prometheus collects every 15 s
global: {scrape_interval: 15s, evaluation_interval: 15s, external_labels: {system: amer-teams}}
rule_files: [/etc/prometheus/alerts.yml]
alerting: {alertmanagers: [{static_configs: [{targets: ["alertmanager:9093"]}]}]}
scrape_configs:
  - job_name: ai-engine          # orchestrator: probes, calls, agents, audit integrity
    static_configs: [{targets: ["orchestrator:8080"]}]
  - job_name: chat               # Synapse
    metrics_path: /_synapse/metrics
    static_configs: [{targets: ["synapse:9000"]}]
  - job_name: media              # LiveKit SFU
    static_configs: [{targets: ["livekit:6789"]}]
  - job_name: postgres
    static_configs: [{targets: ["postgres-exporter:9187"]}]
  - job_name: redis
    static_configs: [{targets: ["redis-exporter:9121"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
