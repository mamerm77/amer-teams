name: Build Amer Teams apps
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin the AI proxy measurement (docs/ENCRYPTED_AI.md)
        shell: bash
        run: python3 -c "import hashlib,subprocess;print('ENCLAVE_MEASUREMENT='+hashlib.sha256(subprocess.check_output(['git','show','HEAD:services/enclave/enclave.py'])).hexdigest())" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r services/orchestrator/requirements.txt && cd services/orchestrator && pytest -q
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin the AI proxy measurement (docs/ENCRYPTED_AI.md)
        shell: bash
        run: python3 -c "import hashlib,subprocess;print('ENCLAVE_MEASUREMENT='+hashlib.sha256(subprocess.check_output(['git','show','HEAD:services/enclave/enclave.py'])).hexdigest())" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - working-directory: app
        run: |
          flutter create . --org com.amerteams --project-name amer_teams --platforms=android
          python3 ../tools/patch_native.py android
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release --dart-define=BUILD_ID=${{ github.run_number }} --dart-define=ENCLAVE_MEASUREMENT=${{ env.ENCLAVE_MEASUREMENT }} --dart-define=BUILD_DATE=${{ github.event.head_commit.timestamp }}
      - name: Name the APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk amer-teams-android.apk
      - uses: actions/upload-artifact@v4
        with: {name: amer-teams-android, path: amer-teams-android.apk}
      - name: Publish to "Latest test build" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-latest
          name: Latest test build
          prerelease: true
          make_latest: false
          body: |
            Latest successful build of `main`, for testing.
            - **Windows:** AmerTeams-Setup-*.exe — if Windows shows "Windows protected your PC", choose More info → Run anyway (not code-signed yet).
            - **Android:** amer-teams-android.apk — open on the phone and allow "Install unknown apps".
            - **iPhone:** see docs/IOS.md (free install with Sideloadly).
          files: amer-teams-android.apk
  windows:
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'   # Firebase C++ SDK still declares an old CMake minimum
    steps:
      - uses: actions/checkout@v4
      - name: Pin the AI proxy measurement (docs/ENCRYPTED_AI.md)
        shell: bash
        run: python3 -c "import hashlib,subprocess;print('ENCLAVE_MEASUREMENT='+hashlib.sha256(subprocess.check_output(['git','show','HEAD:services/enclave/enclave.py'])).hexdigest())" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - name: Build Windows app
        working-directory: app
        shell: bash
        run: |
          flutter create . --org com.amerteams --project-name amer_teams --platforms=windows
          python ../tools/patch_native.py windows
          flutter pub get
          flutter build windows --release --dart-define=BUILD_ID=${{ github.run_number }} --dart-define=ENCLAVE_MEASUREMENT=${{ env.ENCLAVE_MEASUREMENT }} --dart-define=BUILD_DATE=${{ github.event.head_commit.timestamp }}
      - name: Add Visual C++ runtime next to the app
        shell: pwsh
        run: |
          $rel = "app/build/windows/x64/runner/Release"
          foreach ($d in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") { Copy-Item "$env:WINDIR\System32\$d" $rel }
      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          bash installer/stage_server.sh
          $v = (Select-String -Path app/pubspec.yaml -Pattern '^version: (\S+?)\+').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /DVERSION=$v /DAPPDIR=..\app\build\windows\x64\runner\Release /DSERVERDIR=stage\server installer\amer-teams.nsi
          "INSTALLER=installer/AmerTeams-Setup-$v.exe" | Out-File -Append $env:GITHUB_ENV
      - name: Test installer (silent install, launch, uninstall)
        shell: pwsh
        run: |
          Start-Process $env:INSTALLER -ArgumentList "/S" -Wait
          $dir = "$env:ProgramFiles\Amer Teams"
          if (-not (Test-Path "$dir\amer_teams.exe")) { throw "app not installed" }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Amer Teams\Amer Teams.lnk")) { throw "Start menu shortcut missing" }
          $reg = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\AmerTeams"
          if ($reg.DisplayName -ne "Amer Teams") { throw "Installed-apps entry missing" }
          $p = Start-Process "$dir\amer_teams.exe" -PassThru; Start-Sleep 15
          if ($p.HasExited) { throw "app exited on launch with code $($p.ExitCode)" }
          Stop-Process $p -Force
          Start-Process "$dir\Uninstall.exe" -ArgumentList "/S" -Wait; Start-Sleep 5
          if (Test-Path "$dir\amer_teams.exe") { throw "uninstall left files behind" }
          Write-Host "Installer test passed: install, shortcuts, registry, launch, uninstall"
      - uses: actions/upload-artifact@v4
        with: {name: AmerTeams-Setup-windows, path: installer/AmerTeams-Setup-*.exe}
      - name: Publish to "Latest test build" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-latest
          name: Latest test build
          prerelease: true
          make_latest: false
          body: |
            Latest successful build of `main`, for testing.
            - **Windows:** AmerTeams-Setup-*.exe — if Windows shows "Windows protected your PC", choose More info → Run anyway (not code-signed yet).
            - **Android:** amer-teams-android.apk — open on the phone and allow "Install unknown apps".
            - **iPhone:** see docs/IOS.md (free install with Sideloadly).
          files: installer/AmerTeams-Setup-*.exe
      - name: Attach installer to release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: {files: installer/AmerTeams-Setup-*.exe}
  ios:
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin the AI proxy measurement (docs/ENCRYPTED_AI.md)
        shell: bash
        run: python3 -c "import hashlib,subprocess;print('ENCLAVE_MEASUREMENT='+hashlib.sha256(subprocess.check_output(['git','show','HEAD:services/enclave/enclave.py'])).hexdigest())" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - name: Create iOS project
        working-directory: app
        run: |
          flutter create . --org com.amerteams --project-name amer_teams --platforms=ios
          python3 ../tools/patch_native.py ios
          flutter pub get
      - name: Build (unsigned, proves the iOS app compiles)
        if: env.APPLE_TEAM_ID == ''
        working-directory: app
        run: |
          flutter build ios --release --no-codesign --dart-define=BUILD_ID=${{ github.run_number }} --dart-define=ENCLAVE_MEASUREMENT=${{ env.ENCLAVE_MEASUREMENT }} --dart-define=BUILD_DATE=${{ github.event.head_commit.timestamp }}   # Flutter resolves iOS packages itself (Swift Package Manager / CocoaPods)
          mkdir -p build/unsigned/Payload && cp -R build/ios/iphoneos/Runner.app build/unsigned/Payload/
          cd build/unsigned && zip -qr ../AmerTeams-unsigned.ipa Payload
      - name: Upload unsigned IPA (install free with Sideloadly + Apple ID)
        if: env.APPLE_TEAM_ID == ''
        uses: actions/upload-artifact@v4
        with: {name: amer-teams-ios-unsigned, path: app/build/AmerTeams-unsigned.ipa}
      - name: Publish IPA to "Latest test build" release
        if: env.APPLE_TEAM_ID == '' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with: {tag_name: test-latest, name: Latest test build, prerelease: true, make_latest: false, files: app/build/AmerTeams-unsigned.ipa}
      # ---- Signed build + TestFlight upload: runs once the Apple secrets are added ----
      - name: Install signing certificate and profile
        if: env.APPLE_TEAM_ID != ''
        env:
          P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KC=$RUNNER_TEMP/build.keychain; security create-keychain -p ci "$KC"; security set-keychain-settings -lut 21600 "$KC"; security unlock-keychain -p ci "$KC"
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KC"; security list-keychain -d user -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/amer.mobileprovision
          UUID=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/amer.mobileprovision | plutil -extract UUID raw -)
          cat > $RUNNER_TEMP/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>com.amerteams.app</key><string>$UUID</string></dict></dict></plist>
          EOF
          cd app/ios && sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $APPLE_TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = $UUID; CODE_SIGN_IDENTITY = \"Apple Distribution\";/" Runner.xcodeproj/project.pbxproj
      - name: Build signed IPA
        if: env.APPLE_TEAM_ID != ''
        working-directory: app
        run: flutter build ipa --release --dart-define=BUILD_ID=${{ github.run_number }} --dart-define=ENCLAVE_MEASUREMENT=${{ env.ENCLAVE_MEASUREMENT }} --dart-define=BUILD_DATE=${{ github.event.head_commit.timestamp }} --export-options-plist=$RUNNER_TEMP/export.plist --build-number=${{ github.run_number }}
      - name: Upload to TestFlight
        if: env.APPLE_TEAM_ID != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -t ios -f app/build/ios/ipa/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        if: env.APPLE_TEAM_ID != ''
        with: {name: amer-teams-ios, path: app/build/ios/ipa/*.ipa}
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin the AI proxy measurement (docs/ENCRYPTED_AI.md)
        shell: bash
        run: python3 -c "import hashlib,subprocess;print('ENCLAVE_MEASUREMENT='+hashlib.sha256(subprocess.check_output(['git','show','HEAD:services/enclave/enclave.py'])).hexdigest())" >> $GITHUB_ENV
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - working-directory: app
        run: |
          flutter create . --org com.amerteams --project-name amer_teams --platforms=linux
          flutter pub get
          flutter test          # includes ML-KEM / hybrid key vectors shared with the Python reference
          flutter build linux --release --dart-define=BUILD_ID=${{ github.run_number }} --dart-define=ENCLAVE_MEASUREMENT=${{ env.ENCLAVE_MEASUREMENT }} --dart-define=BUILD_DATE=${{ github.event.head_commit.timestamp }}
      - uses: actions/upload-artifact@v4
        with: {name: amer-teams-linux, path: app/build/linux/x64/release/bundle/}
  in-use:
    # Drives the real app (Linux build) against the real server stack, with a real encrypted peer, and screenshots every step.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Pin the AI proxy measurement (docs/ENCRYPTED_AI.md)
        shell: bash
        run: python3 -c "import hashlib,subprocess;print('ENCLAVE_MEASUREMENT='+hashlib.sha256(subprocess.check_output(['git','show','HEAD:services/enclave/enclave.py'])).hexdigest())" >> $GITHUB_ENV
      - run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev xvfb imagemagick gnome-keyring dbus-x11 pulseaudio libolm-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good network-manager
          sudo systemctl start NetworkManager || sudo NetworkManager || true
          busctl --system list | grep -q NetworkManager && echo "NetworkManager on the system bus" 
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Start the real server stack
        run: bash tools/ci_stack.sh
      - name: Start Bob (encrypted peer)
        run: |
          pip install "matrix-nio[e2e]" livekit numpy httpx kyber-py
          PEER_LOG=$PWD/peer.log PEER_READY=$PWD/peer.ready nohup python -u tests/ui_peer.py > peer.out 2>&1 &
          for i in $(seq 60); do [ -f peer.ready ] && break; sleep 2; done; cat peer.out; test -f peer.ready
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - name: Use the app as a person would
        working-directory: app
        run: |
          flutter create . --org com.amerteams --project-name amer_teams --platforms=linux
          flutter pub get
          mkdir -p $GITHUB_WORKSPACE/shots
          pulseaudio --start --exit-idle-time=-1 && pactl load-module module-null-sink sink_name=virt && pactl load-module module-virtual-source source_name=mic master=virt.monitor || true
          dbus-run-session -- bash -c "echo amer | gnome-keyring-daemon --unlock --components=secrets >/dev/null; \
            SHOTS=$GITHUB_WORKSPACE/shots xvfb-run -a -s '-screen 0 1440x900x24' flutter test integration_test/app_flow_test.dart -d linux \
            --dart-define=BUILD_ID=${{ github.run_number }} --dart-define=ENCLAVE_MEASUREMENT=${{ env.ENCLAVE_MEASUREMENT }} --dart-define=BUILD_DATE=${{ github.event.head_commit.timestamp }}" 2>&1 | tee $GITHUB_WORKSPACE/shots/flutter.log || true
          grep -E "^(PASS|FAIL)|IN-USE RESULT" $GITHUB_WORKSPACE/shots/flutter.log || true
      - name: Encryption audit of the app's own events (Synapse database)
        if: always()
        run: |
          # every non-state event the app (user moh) sent must be encrypted; redactions are cleartext by protocol
          cd deploy
          Q="SELECT type, count(*) FROM events WHERE sender='@moh:amer.test' AND state_key IS NULL AND type NOT IN ('m.room.encrypted','m.room.redaction') GROUP BY type"
          OUT=$(docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T postgres psql -U synapse -d synapse -tAc "$Q")
          ENC=$(docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T postgres psql -U synapse -d synapse -tAc "SELECT count(*) FROM events WHERE sender='@moh:amer.test' AND type='m.room.encrypted'")
          mkdir -p ../shots; echo "encrypted=$ENC unencrypted=[$OUT]" | tee ../shots/encryption-audit.txt
          if [ -n "$OUT" ]; then echo "ENCRYPTION AUDIT: FAIL — the app sent unencrypted events: $OUT"; else echo "ENCRYPTION AUDIT: PASS — all $ENC app events encrypted"; fi
      - name: Collect logs
        if: always()
        run: |
          mkdir -p shots; cp peer.log peer.out shots/ 2>/dev/null || true
          cd deploy && docker compose -f docker-compose.yml -f docker-compose.local.yml logs --no-color orchestrator livekit synapse > ../shots/server.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: in-use-screenshots, path: shots/}
      - name: Publish screenshots to the in-use-results branch
        if: always()
        run: |
          cd shots && git init -q -b in-use-results && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "In-use run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" in-use-results
