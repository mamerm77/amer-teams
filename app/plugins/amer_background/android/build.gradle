group 'com.amerteams.background'
version '0.1.0'
buildscript {
    ext.kotlin_version = '1.9.24'
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.3.2'; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" }
}
rootProject.allprojects { repositories { google(); mavenCentral() } }
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
android {
    namespace 'com.amerteams.background'
    compileSdk 36
    defaultConfig { minSdk 21 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets { main.java.srcDirs += 'src/main/kotlin' }
}
dependencies {
    // WebRTC classes come from flutter_webrtc at run time; compile against the same SDK without packaging it twice
    compileOnly 'io.github.webrtc-sdk:android:150.7871.04'
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
}
