name: amer_teams
description: Amer Teams — end-to-end encrypted collaboration with an AI agent engine.
publish_to: none
version: 0.5.1+6
environment:
  sdk: ">=3.11.0 <4.0.0"
dependencies:
  flutter: {sdk: flutter}
  matrix: ^17.0.0                 # Matrix SDK with E2EE (Olm/Megolm via vodozemac)
  flutter_vodozemac: ^0.9.1       # native crypto for matrix
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.4.2      # desktop SQLite
  path_provider: ^2.1.4
  amer_background: {path: plugins/amer_background}   # blur + low light, on device (docs/BACKGROUND_EFFECTS.md)
  flutter_webrtc: any            # MediaRecorder for on-device meeting recordings
  livekit_client: ^2.3.0          # WebRTC + E2EE frame encryption
  http: ^1.2.2
  provider: ^6.1.2
  speech_to_text: ^7.0.0          # on-device captions (text stays local)
  crypto: ^3.0.6
  archive: ^4.0.0              # read Office files (zip) for on-device previews
  xml: ^6.5.0
  pdfrx: ^2.0.0                # PDF previews, rendered on this device (pdfium)
  cryptography: ^2.7.0          # X25519, HKDF, AES-GCM for the AI enclave proxy (docs/ENCRYPTED_AI.md)
  pqcrypto: ^0.4.4
  record: ^6.2.1                  # voice messages
  media_kit: ^1.1.11                # Stream: in-app video playback (Windows, Linux, Android, iOS)
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  flutter_tts: ^4.2.2               # Immersive Reader read-aloud and spoken interpretation
  audioplayers: ^6.8.1            # voice message playback               # ML-KEM-768 (FIPS 203), pure Dart
  file_picker: ^13.4.0
  intl: any                       # the version flutter_localizations pins
  flutter_localizations: {sdk: flutter}   # Arabic (right to left) and English (docs/ARABIC.md)
  permission_handler: ^11.3.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
dev_dependencies:
  flutter_test: {sdk: flutter}
  integration_test: {sdk: flutter}
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
