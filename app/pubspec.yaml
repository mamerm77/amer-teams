name: amer_teams
description: Amer Teams — end-to-end encrypted collaboration with an AI agent engine.
publish_to: none
version: 0.5.0+5
environment:
  sdk: ">=3.11.0 <4.0.0"
dependencies:
  flutter: {sdk: flutter}
  matrix: ^17.0.0                 # Matrix SDK with E2EE (Olm/Megolm via vodozemac)
  flutter_vodozemac: ^0.9.1       # native crypto for matrix
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.4.2      # desktop SQLite
  path_provider: ^2.1.4
  livekit_client: ^2.3.0          # WebRTC + E2EE frame encryption
  http: ^1.2.2
  provider: ^6.1.2
  speech_to_text: ^7.0.0          # on-device captions (text stays local)
  crypto: ^3.0.6
  pqcrypto: ^0.4.4
  record: ^6.2.1                  # voice messages
  audioplayers: ^6.8.1            # voice message playback               # ML-KEM-768 (FIPS 203), pure Dart
  file_picker: ^13.4.0
  intl: ^0.19.0
  permission_handler: ^11.3.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
dev_dependencies:
  flutter_test: {sdk: flutter}
  integration_test: {sdk: flutter}
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
